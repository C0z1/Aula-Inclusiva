name: Pruebas

# En cada push a cualquier rama (incluye las ramas de los PR).
on:
  push:
  workflow_dispatch:

jobs:
  modelos:
    name: swift test (modelos)
    runs-on: ubuntu-latest
    container: swift:5.10-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxis de toda la app
        run: find MeCuido.swiftpm -name '*.swift' ! -name Package.swift -print0 | xargs -0 swiftc -parse
      - run: swift test

  app:
    name: compilar app (iPad)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compilar para el simulador de iPad
        working-directory: MeCuido.swiftpm
        # Los errores se publican como anotaciones para verlos sin acceso a los logs.
        run: |
          set -o pipefail
          # El esquema lo genera Xcode a partir del paquete; se toma el primero que reporte.
          SCHEME=$(xcodebuild -list -json 2>/dev/null | python3 -c '
          import sys, json
          d = json.load(sys.stdin)
          info = d.get("workspace") or d.get("project") or {}
          print(info.get("schemes", [""])[0])')
          echo "::notice::Esquema: $SCHEME"
          if [ -z "$SCHEME" ]; then xcodebuild -list 2>&1 | tail -20 | sed 's/^/::error::/'; exit 1; fi
          xcodebuild build -scheme "$SCHEME" -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/dd" 2>&1 | tee build.log || {
            grep -E "error:|fatal" build.log | sort -u | head -40 | sed 's/^/::error::/'
            tail -15 build.log | sed 's/^/::warning::/'
            exit 1
          }

      # Abre la app en un simulador de iPad: si se cierra al arrancar, el job falla con el reporte del cierre.
      - name: Abrir en el simulador de iPad
        working-directory: MeCuido.swiftpm
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "::error::No se encontró el .app compilado"; exit 1; }
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import sys, json
          ipads = [d for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPad")]
          ipads.sort(key=lambda d: ("Pro" not in d["name"], d["name"]))
          print(ipads[0]["udid"] if ipads else "")')
          [ -n "$UDID" ] || { echo "::error::No hay simuladores de iPad disponibles"; exit 1; }
          echo "::notice::App $BUNDLE en $(xcrun simctl list devices | grep "$UDID" | sed 's/^ *//')"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p capturas

          PID=$(xcrun simctl launch "$UDID" "$BUNDLE" | awk '{print $NF}')
          sleep 15
          xcrun simctl io "$UDID" screenshot capturas/1-inicio.png
          sleep 5
          if ! ps -p "$PID" > /dev/null; then
            echo "::error::La app se cerró después de abrirla"
            find ~/Library/Logs/DiagnosticReports -newer build.log \( -name '*Cuido*' -o -name 'AppModule*' \) -print0 \
              | xargs -0 -I{} sh -c 'head -c 6000 "{}"' | sed 's/^/::warning::/' | head -80
            exit 1
          fi
          echo "::notice::La app sigue abierta después de 20 s"
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Recorridos tocando la pantalla (pruebas-ui/*.yaml): cada pantalla y botón de la app.
      - name: Recorridos con Maestro
        working-directory: MeCuido.swiftpm
        run: |
          set -o pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          export PATH="$PATH:$HOME/.maestro/bin"
          {
            maestro --device "$UDID" test ../pruebas-ui --exclude-tags texto-grande --test-output-dir "$RUNNER_TEMP/maestro" &&
            # Mismo iPad con el texto de accesibilidad más grande.
            xcrun simctl ui "$UDID" content_size accessibility-extra-extra-extra-large &&
            maestro --device "$UDID" test ../pruebas-ui --include-tags texto-grande --test-output-dir "$RUNNER_TEMP/maestro-texto-grande"
          } 2>&1 | tee maestro.log || {
            grep -E "FAILED|Assertion|not found|crash|✗" maestro.log | head -20 | sed 's/^/::error::/'
            find ~/Library/Logs/DiagnosticReports -newer build.log \( -name '*Cuido*' -o -name 'AppModule*' \) -print0               | xargs -0 -I{} sh -c 'head -c 6000 "{}"' | sed 's/^/::warning::/' | head -80
            exit 1
          }
          echo "::notice::Recorrido completo sin errores"

      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-ipad
          path: |
            MeCuido.swiftpm/capturas
            pruebas-ui/capturas
            ${{ runner.temp }}/maestro
            ${{ runner.temp }}/maestro-texto-grande
          if-no-files-found: ignore
