name: Pruebas

# En cada push a cualquier rama (incluye las ramas de los PR).
on:
  push:
  workflow_dispatch:

jobs:
  modelos:
    name: swift test (modelos)
    runs-on: ubuntu-latest
    container: swift:5.10-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxis de toda la app
        run: find MeCuido.swiftpm -name '*.swift' ! -name Package.swift -print0 | xargs -0 swiftc -parse
      - run: swift test

  app:
    name: compilar app (iPad)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compilar para el simulador de iPad
        working-directory: MeCuido.swiftpm
        # Los errores se publican como anotaciones para verlos sin acceso a los logs.
        run: |
          set -o pipefail
          xcodebuild -list 2>&1 | tee list.log || { tail -20 list.log | sed 's/^/::error::/'; exit 1; }
          xcodebuild build             -scheme "Me Cuido"             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log             || { grep -E "error:|fatal" build.log | sort -u | head -40 | sed 's/^/::error::/'; tail -15 build.log | sed 's/^/::warning::/'; exit 1; }
