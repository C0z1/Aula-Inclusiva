# Recorrido completo en el simulador de iPad con Maestro (lo corre el CI).
# Toca la app como lo haría un niño o un adulto; si se cierra en cualquier paso, la prueba falla.
appId: mx.aulainclusiva.mecuido
---
- launchApp:
    clearState: true
- assertVisible: "Mis logros"
- takeScreenshot: capturas/1-inicio

# Dos rutinas seguidas hasta la celebración y de regreso al inicio (donde se cerraba la app).
- runFlow:
    file: subflujos/rutina.yaml
    env:
      RUTINA: "Atarme las agujetas"
- runFlow:
    file: subflujos/rutina.yaml
    env:
      RUTINA: "Ordenar mi mochila"
- runFlow:
    file: subflujos/rutina.yaml
    env:
      RUTINA: "Atarme las agujetas"
- assertVisible: ".*3 medallas.*"

# Mascota: elegir una ilustrada.
- tapOn: "Tu mascota.*"
- assertVisible: "Mi mascota"
- scrollUntilVisible:
    element: "Panda"
    direction: DOWN
- tapOn: "Panda"
- takeScreenshot: capturas/5-mascota
- tapOn: "Listo"

# Ajustes para adultos (engrane + multiplicación).
- runFlow: subflujos/ajustes.yaml
- takeScreenshot: capturas/7-ajustes
- tapOn: "Rutinas.*"
- tapOn: "Nueva rutina"
- assertVisible: "Pasos"
- takeScreenshot: capturas/8-editor
